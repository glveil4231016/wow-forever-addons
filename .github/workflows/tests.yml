name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  profitboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lupa
        run: python -m pip install --upgrade pip lupa

      - name: Lua unit tests
        run: python tests/run_pb.py

      - name: Lua syntax check
        run: python tests/syntax_check.py
